<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    description="A leaderboard for Codewars users, showing their ranks and scores based on their performance on the platform.">
  <title>Codewars leaderboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header class="container">
    <h1>Codewars Leaderboard</h1>
  </header>

  <main class="container">


    <section aria-labelledby="search-heading" class="card">
      <h2 id="search-heading">Search Users</h2>

      <form id="search-form">
        <label for="usernames">
          Enter usernames (comma separated)
        </label>

        <input id="usernames" name="usernames" type="text" placeholder="CodeYourFuture, 40thieves, Abubakar-Meigag"
          required />

        <button type="submit">
          Submit
        </button>
      </form>
      <section aria-labelledby="ranking-heading" class="card">
        <h2 id="ranking-heading">Select Ranking</h2>

        <label for="ranking-select" class="visually-hidden">
          Choose ranking type
        </label>

        <select id="ranking-select">

        </select>
      </section>
    </section>


    <section id="message" role="alert" aria-live="polite"></section>

    <section aria-labelledby="table-heading" class="card">
      <h2 id="table-heading">Leaderboard</h2>

      <table>
        <thead>
          <tr>
            <th scope="col">Username</th>
            <th scope="col">Clan</th>
            <th scope="col">Score</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
        </tbody>
      </table>
    </section>

  </main>

</body>

<script src="index.mjs" type="module"></script>

</html>
